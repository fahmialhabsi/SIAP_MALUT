# SIAP MALUT: pemasangan dengan kontainer. Salin .env.example menjadi .env lalu sesuaikan.
# Basis data (PostgreSQL) ditambahkan pada Tahap 1.3.
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_MODE: ${APP_MODE:-production}
      PORT: 3000
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '${API_PORT:-3000}:3000'
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_APP_MODE: ${APP_MODE:-production}
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      - api
    restart: unless-stopped
