# SIAP MALUT: pemasangan dengan kontainer. Salin .env.example menjadi .env lalu isi POSTGRES_PASSWORD.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: siap
      POSTGRES_DB: siap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Isi POSTGRES_PASSWORD di berkas .env}
    volumes:
      - siap_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U siap -d siap']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_MODE: ${APP_MODE:-production}
      PORT: 3000
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://siap:${POSTGRES_PASSWORD:?Isi POSTGRES_PASSWORD di berkas .env}@db:5432/siap
      SIAP_ADMIN_PASSWORD: ${SIAP_ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${API_PORT:-3000}:3000'
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_APP_MODE: ${APP_MODE:-production}
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      - api
    restart: unless-stopped

volumes:
  siap_pgdata:
