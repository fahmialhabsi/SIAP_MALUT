server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Service worker tidak boleh di-cache lama agar pembaruan PWA cepat sampai.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
