server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Unggahan lampiran (batas aplikasi 10 MB).
  client_max_body_size 12m;

  # API dan titik kesehatan diteruskan ke layanan api (satu asal bagi peramban).
  # Variabel + resolver agar nginx tetap start walau api belum siap.
  location ~ ^/(api/|health$|ready$) {
    resolver 127.0.0.11 valid=10s;
    set $api http://api:3000;
    proxy_pass $api;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Service worker tidak boleh di-cache lama agar pembaruan PWA cepat sampai.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
